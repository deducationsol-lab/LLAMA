# Optional standalone API deployment. Vercel already serves /api/agent with the frontend.
# The frontend uses same-origin /api/agent; using Render requires a same-origin proxy.
services:
  - type: web
    name: llama-life-swarm-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: LLAMA_PROVIDER
        value: llama
      - key: LLAMA_API_KEY
        sync: false
      - key: LLAMA_MODEL
        sync: false
      - key: LLAMA_ACCESS_CODE
        sync: false
