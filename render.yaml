# Optional standalone API deployment. Vercel already serves /api/agent with the frontend.
# The frontend uses same-origin /api/agent; using Render requires a same-origin proxy.
services:
  - type: web
    name: llama-life-swarm-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: MUSE_BASE_URL
        value: https://api.meta.ai/v1
      - key: MUSE_CHAT_PATH
        value: /chat/completions
      - key: MUSE_MODEL_ID
        value: muse-spark-1.3
      - key: MODEL_API_KEY
        sync: false
      - key: HOUSEHOLD_ACCESS_CODE
        sync: false
